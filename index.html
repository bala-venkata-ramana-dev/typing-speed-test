<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bala's Speed Typing Test</title>
    <link rel="stylesheet" href="bala_typingtest.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous" />
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>
</head>

<body>
    <div class="bg-container" id="speedTypingTest">
        <h1 class="typingtest-heading mb-3">Speed<br /> Typing Test</h1>
        <p class="mb-5 motoparagraph">On your fingers lets set Go!</p>
        <div class="d-flex flex-row mb-5">
            <img src="https://assets.ccbp.in/frontend/dynamic-webapps/clock-img.png" class="clockimg mr-4" />
            <P id="timer" class="spanE1 mr-1"></P>
            <P class="motoparagraph pt-3">seconds</P>
        </div>
        <div id="validationCheckContainer" class="textValidationContainer mb-4">

            <div class="d-flex flex-column justify-content-center">
                <p id="quoteDisplay" class="quotedisplaystyle"></p>
                <div class="text-center d-none" id="spinnerComponent">
                    <div class="spinner-border" role="status">
                        <span class="sr-only">Loading...</span>
                    </div>
                </div>
                <textarea rows="5" cols="150" placeholder="Type here!!" id="quoteInput" class="textareaElement mb-4"></textarea>
            </div>
        </div>
        <p id="result" class="resultparagraph"></p>
        <button id="submitBtn" class="submitbtn mr-5">Submit</button>
        <button id="resetBtn" class="resetbtn">Reset</button>

    </div>

    <script src="bala_typingtest.js"></script>
</body>

</html>
